<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helium Unified Tabs</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Helium Unified Tabs</h1><p>Одна горячая клавиша для закрытия и сна вкладок.</p><label for="mode">Какие обычные вкладки защищать?</label><select id="mode"><option value="groups">В группах Chromium</option><option value="manual">Только вручную защищённые</option><option value="all">Все вкладки</option></select><label for="pinnedAction">Закреплённые вкладки</label><select id="pinnedAction"><option value="sleep">Выгружать, сохраняя URL</option><option value="reset">Сбрасывать на домашний URL</option></select><p class="hint">Назначь Ctrl+W в <code>helium://extensions/shortcuts</code>. Папки Helium могут не иметь groupId.</p><button id="sleep">Усыпить текущую вкладку</button><p id="status" role="status"></p><h2>Переименование текущей вкладки</h2><form id="rename-form"><input id="custom-title" maxlength="120" placeholder="Например, Расписание" autocomplete="off" required><div class="buttons"><button type="submit">Сохранить</button><button id="restore-title" type="button">Сбросить</button></div></form><p id="title-status" role="status"></p><p id="group-info" class="hint">Проверка группы…</p></main><script src="popup.js"></script></body></html>
